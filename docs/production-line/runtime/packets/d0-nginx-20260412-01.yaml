packet_id: d0-nginx-20260412-01
day: Day 2-Day 3
lane_type: nginx
objective: >
  Install Nginx as the active web server and make `/` and `/api` return the exact required HTTP behavior.
scope_in:
  - Nginx install and enablement
  - site config
  - root page content
  - `/api` JSON behavior
scope_out:
  - SSH config
  - TLS issuance
repo_root: <target-root>
worktree:
  path: <target-root>
  branch: main
primary_surface: mixed
required_reads:
  - AGENTS.md
  - devops-stage0-sprint_v1_0.md
  - docs/devops-stage0-sprint/01_nginx_contract.md
inputs:
  - hardened SSH and firewall posture
deliverables:
  - active Nginx service
  - correct root page
  - correct `/api`
verification:
  commands:
    - systemctl status nginx
    - curl -i http://<domain-or-ip>/
    - curl -i http://<domain-or-ip>/api
  manual_proofs:
    - username is visible on the root page
    - `/api` body matches exactly
green_level: gate_green
evidence_updates:
  - docs/devops-stage0-sprint/07_progress_tracker.md
  - docs/devops-stage0-sprint/08_evidence_log.md
  - docs/devops-stage0-sprint/09_decisions_log.md
  - docs/devops-stage0-proof/01_raw_journal/2026-04-11_day_1.md
escalate_when:
  - another web server owns the ports or routes unexpectedly
closeout_contract:
  must_report:
    - summary
    - files changed
    - checks run
    - blocker status
    - next exact starting point
    - next handoff point
