packet_id: d0-proof-20260411-01
day: Day 1-Day 6
lane_type: proof
objective: >
  Keep the DevOps Stage 0 progress, evidence, decisions, journal, and sign-off artifacts current in the same session as the real server work.
scope_in:
  - docs/devops-stage0-sprint/
  - docs/devops-stage0-delivery/
  - docs/devops-stage0-proof/
scope_out:
  - server configuration unless the proof lane is also the active implementation lane
repo_root: <target-root>
worktree:
  path: <target-root>
  branch: main
primary_surface: mixed
required_reads:
  - AGENTS.md
  - devops-stage0-proof-sprint_v1_0.md
inputs:
  - all active lane closeouts
deliverables:
  - current trackers and logs
  - current journal entry
verification:
  commands:
    - append logs after each substantive block
  manual_proofs:
    - evidence entries reference real commands, configs, or live behavior
green_level: lane_green
evidence_updates:
  - docs/devops-stage0-sprint/08_evidence_log.md
  - docs/devops-stage0-sprint/09_decisions_log.md
  - docs/devops-stage0-proof/01_raw_journal/2026-04-11_day_1.md
escalate_when:
  - proof would require inventing a result
closeout_contract:
  must_report:
    - summary
    - files changed
    - blocker status
    - next exact starting point
    - next handoff point
