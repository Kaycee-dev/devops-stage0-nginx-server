packet_id: d0-provisioning-20260411-01
day: Day 1
lane_type: provisioning
objective: >
  Lock the provider, distro, domain, exact HNG username, and checker-key status so the server work can proceed without ambiguity.
scope_in:
  - provider facts
  - domain facts
  - username facts
  - checker-key status
scope_out:
  - SSH hardening
  - Nginx config
  - TLS
repo_root: <target-root>
worktree:
  path: <target-root>
  branch: main
primary_surface: mixed
required_reads:
  - AGENTS.md
  - devops-stage0-sprint_v1_0.md
  - docs/devops-stage0-delivery/00_provider_and_domain_spec.md
inputs:
  - operator-provided provider and domain details
deliverables:
  - recorded environment facts
  - confirmed blocker list
verification:
  commands:
    - record the values in the tracker and delivery docs
  manual_proofs:
    - domain and username are explicit
green_level: gate_green
evidence_updates:
  - docs/devops-stage0-sprint/07_progress_tracker.md
  - docs/devops-stage0-delivery/06_progress_tracker.md
  - docs/devops-stage0-sprint/08_evidence_log.md
  - docs/devops-stage0-proof/01_raw_journal/2026-04-11_day_1.md
escalate_when:
  - provider access or domain control is missing
closeout_contract:
  must_report:
    - summary
    - blocker status
    - next exact starting point
    - next handoff point
