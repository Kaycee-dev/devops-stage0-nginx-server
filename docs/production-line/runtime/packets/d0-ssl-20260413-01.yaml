packet_id: d0-ssl-20260413-01
day: Day 3-Day 5
lane_type: ssl
objective: >
  Leave the live domain reachable over HTTPS with a valid Let's Encrypt certificate and a 301 redirect from HTTP.
scope_in:
  - DNS validation
  - Certbot issuance
  - Nginx TLS config
  - redirect behavior
scope_out:
  - SSH hardening
  - `/api` payload contents
repo_root: <target-root>
worktree:
  path: <target-root>
  branch: main
primary_surface: mixed
required_reads:
  - AGENTS.md
  - devops-stage0-sprint_v1_0.md
  - docs/devops-stage0-sprint/02_tls_and_dns_plan.md
inputs:
  - working HTTP Nginx baseline
  - domain control
deliverables:
  - valid Let's Encrypt cert
  - HTTPS endpoint
  - 301 redirect
verification:
  commands:
    - curl -I http://<domain>/
    - curl -i https://<domain>/api
    - openssl s_client -connect <domain>:443 -servername <domain>
  manual_proofs:
    - redirect status is 301
    - certificate is publicly valid
green_level: release_green
evidence_updates:
  - docs/devops-stage0-sprint/07_progress_tracker.md
  - docs/devops-stage0-delivery/07_evidence_log.md
  - docs/devops-stage0-sprint/09_decisions_log.md
  - docs/devops-stage0-proof/01_raw_journal/2026-04-11_day_1.md
escalate_when:
  - domain control is missing
  - Let's Encrypt issuance still fails after one safe repair attempt
closeout_contract:
  must_report:
    - summary
    - files changed
    - checks run
    - blocker status
    - next exact starting point
    - next handoff point
